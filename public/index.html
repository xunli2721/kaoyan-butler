<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研小管家 - AI考研备考助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #fffcf7;
      --surface-alt: #f0ebe0;
      --text: #2c2417;
      --text-secondary: #8a7e6d;
      --text-tertiary: #b5aa97;
      --accent: #6b5b4e;
      --accent-light: #f0ebe4;
      --accent-gradient: linear-gradient(135deg, #5a4a3e, #8b7355);
      --warm: #c47d3f;
      --warm-light: #fdf3e7;
      --green: #5a8a6a;
      --green-light: #eaf3ed;
      --red: #c0504d;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(44,36,23,0.06);
      --shadow-md: 0 4px 12px rgba(44,36,23,0.08);
      --shadow-lg: 0 12px 40px rgba(44,36,23,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'LXGW WenKai', -apple-system, sans-serif;
      background: #3a3228;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 30% 0%, rgba(196,125,63,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 100%, rgba(107,91,78,0.08) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative; z-index: 1;
      box-shadow:
        -80px 0 100px -40px rgba(0,0,0,0.3),
        80px 0 100px -40px rgba(0,0,0,0.3),
        0 0 60px rgba(0,0,0,0.15);
    }

    /* Header */
    .header {
      background: var(--accent-gradient);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,125,63,0.4), transparent);
    }
    .header::after {
      content: '';
      position: absolute; top: -60%; right: -5%;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(196,125,63,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-avatar {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .header-info h1 { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    .header-info p { font-size: 11px; opacity: 0.6; font-weight: 300; letter-spacing: 0.5px; }
    .header-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
    }
    .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .status-dot.connected { background: var(--green); }
    .mobile-btn {
      display: none;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer; font-size: 16px;
    }

    /* Main Layout */
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Messages */
    .message-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 82%;
      animation: fadeInUp 0.3s ease;
    }
    .message-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.assistant { align-self: flex-start; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      background: var(--surface-alt);
      border: 1.5px solid rgba(44,36,23,0.06);
    }
    .message-wrapper.user .msg-avatar { background: var(--accent-light); }
    .msg-content { display: flex; flex-direction: column; gap: 4px; }
    .message {
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .message.user {
      background: var(--accent-gradient);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(44,36,23,0.05);
      border-bottom-left-radius: 4px;
    }
    .msg-time { font-size: 10px; color: var(--text-tertiary); padding: 0 4px; }
    .message-wrapper.user .msg-time { text-align: right; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Long message collapse */
    .message.collapsed { max-height: 180px; overflow: hidden; position: relative; }
    .message.collapsed::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 36px; background: linear-gradient(transparent, var(--surface));
    }
    .msg-expand-btn {
      background: none; border: none; color: var(--accent);
      font-size: 12px; cursor: pointer; padding: 2px 0;
    }

    /* Date separator */
    .date-separator {
      display: flex; align-items: center; gap: 14px; margin: 8px 0;
    }
    .date-separator::before, .date-separator::after {
      content: ''; flex: 1; height: 1px; background: rgba(44,36,23,0.08);
    }
    .date-separator span {
      font-size: 11px; color: var(--text-tertiary); white-space: nowrap;
      font-weight: 300; letter-spacing: 1px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none; align-self: flex-start;
      padding: 10px 14px; background: var(--surface);
      border-radius: 16px; box-shadow: var(--shadow-sm);
      border: 1px solid rgba(44,36,23,0.05);
      align-items: center; gap: 8px;
    }
    .typing-indicator span:not(.thinking-text):not(.thinking-dots) {
      display: inline-block; width: 6px; height: 6px;
      background: var(--text-tertiary); border-radius: 50%; margin: 0 1px;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(3) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(4) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
    .thinking-text { color: #999; font-size: 12px; }
    .thinking-dots::after { content: ''; animation: dots 1.5s steps(4,end) infinite; }
    @keyframes dots {
      0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
    }

    /* Rendered content (KaTeX + Markdown) */
    .message.assistant .katex { font-size: 1.05em; }
    .message.assistant .katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .message.assistant code { background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
    .message.assistant pre { background: var(--surface-alt); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
    .message.assistant pre code { background: none; padding: 0; }
    .message.assistant p { margin: 4px 0; }
    .message.assistant ul, .message.assistant ol { padding-left: 20px; margin: 4px 0; }
    .formula-btn { width: 36px; height: 36px; border: 1px solid var(--border,#ddd); border-radius: 8px; background: var(--surface-alt,#f0ebe0); color: var(--text-secondary,#8a7e6d); font-size: 13px; font-weight: 700; font-style: italic; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
    .formula-btn:hover { background: var(--accent-light,#e8f0fe); color: var(--accent,#4a7dff); border-color: var(--accent,#4a7dff); }
    .image-preview-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--surface-alt,#f0ebe0); border-top: 1px solid var(--border,#eee); }
    .image-preview-bar img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border,#ddd); }
    .formula-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
    .formula-modal-overlay.open { display: flex; }
    .formula-modal { background: var(--surface,#fffcf7); border-radius: 14px; width: 90%; max-width: 640px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.15); overflow: hidden; }
    .formula-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border,#eee); }
    .formula-modal-header span { font-size: 15px; font-weight: 600; }
    .formula-modal-close { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-secondary,#888); padding: 4px; }
    .formula-modal-body { display: flex; flex: 1; min-height: 0; }
    .formula-modal-left { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border,#eee); padding: 14px; }
    .formula-modal-left label { font-size: 12px; color: var(--text-secondary,#888); margin-bottom: 6px; }
    .formula-modal-left textarea { flex: 1; min-height: 120px; padding: 10px; border: 1px solid var(--border,#ddd); border-radius: 8px; font-size: 14px; font-family: 'Courier New', monospace; resize: none; outline: none; }
    .formula-modal-left textarea:focus { border-color: var(--accent,#4a7dff); }
    .formula-modal-hint { font-size: 11px; color: var(--text-tertiary,#aaa); margin-top: 6px; line-height: 1.5; }
    .formula-modal-right { flex: 1; display: flex; flex-direction: column; padding: 14px; }
    .formula-modal-right label { font-size: 12px; color: var(--text-secondary,#888); margin-bottom: 6px; }
    .formula-preview { flex: 1; min-height: 120px; padding: 10px; background: var(--bg,#f5f0e8); border-radius: 8px; overflow: auto; font-size: 16px; line-height: 1.8; display: flex; align-items: center; justify-content: center; }
    .formula-preview .katex-display { margin: 0; }
    .formula-modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--border,#eee); }
    .formula-modal-footer button { padding: 7px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .formula-insert-btn { border: none; background: var(--accent,#4a7dff); color: #fff; }
    .formula-insert-btn:hover { opacity: 0.9; }
    .formula-cancel-btn { border: 1px solid var(--border,#ddd); background: none; }
    @media (max-width: 600px) {
      .formula-modal-body { flex-direction: column; }
      .formula-modal-left { border-right: none; border-bottom: 1px solid var(--border,#eee); }
    }

    /* Quick actions */
    .quick-actions {
      display: flex; gap: 8px; padding: 8px 20px;
      overflow-x: auto; background: var(--surface);
      border-top: 1px solid rgba(44,36,23,0.06);
    }
    .quick-actions::-webkit-scrollbar { display: none; }
    .quick-chip {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(44,36,23,0.1); background: transparent;
      font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
      color: var(--text-secondary);
    }
    .quick-chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* Input area */
    .input-area {
      padding: 12px 20px; background: var(--surface);
      border-top: 1px solid rgba(44,36,23,0.06); display: flex; gap: 10px;
    }
    #messageInput {
      flex: 1; border: 1.5px solid rgba(44,36,23,0.1); background: var(--bg);
      padding: 10px 16px; border-radius: 22px; font-size: 14px; outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #messageInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(107,91,78,0.1); }
    .send-btn {
      width: 42px; height: 42px; border: none;
      background: var(--accent-gradient);
      color: white; border-radius: 50%; cursor: pointer;
      font-size: 16px; transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-md); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Welcome card */
    .welcome-card {
      background: var(--accent-light);
      border: 1px solid rgba(107,91,78,0.1);
      border-radius: var(--radius); padding: 16px; margin: 4px 0;
    }
    .welcome-card h3 { font-size: 14px; color: var(--accent); margin-bottom: 10px; font-weight: 700; }
    .welcome-features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .welcome-feature {
      background: var(--surface); border-radius: var(--radius-sm); padding: 10px;
      font-size: 12px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(44,36,23,0.04);
    }
    .welcome-feature:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .welcome-feature .wf-icon { font-size: 18px; }
    .welcome-feature .wf-text { font-size: 11px; color: var(--text-secondary); }

    /* ========== Sidebar ========== */
    .sidebar {
      width: 340px; flex-shrink: 0;
      border-left: 1px solid rgba(44,36,23,0.08);
      display: flex; flex-direction: column;
      background: var(--surface);
    }
    .sidebar-tabs {
      display: flex; border-bottom: 1px solid rgba(44,36,23,0.08); flex-shrink: 0;
      background: var(--surface);
    }
    .sidebar-tab {
      flex: 1; padding: 12px; border: none; background: none;
      font-size: 13px; font-weight: 500; color: var(--text-tertiary);
      cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s;
      border-bottom: 2.5px solid transparent; font-family: inherit;
      position: relative;
    }
    .sidebar-tab:hover { color: var(--accent); background: rgba(107,91,78,0.04); }
    .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .sidebar-tab:hover { color: var(--accent); }
    .sidebar-content {
      flex: 1; overflow-y: auto; padding: 14px;
    }
    .sidebar-content::-webkit-scrollbar { width: 4px; }
    .sidebar-content::-webkit-scrollbar-thumb { background: rgba(44,36,23,0.1); border-radius: 2px; }

    /* Plan items */
    .plan-header {
      font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;
      font-weight: 700; letter-spacing: 0.5px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(44,36,23,0.06);
    }
    .plan-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--bg); margin-bottom: 6px;
      transition: all 0.15s;
      border: 1px solid transparent;
      border-left: 3px solid var(--accent);
      position: relative;
    }
    .plan-item:hover { border-color: rgba(44,36,23,0.06); border-left-color: var(--accent); }
    .plan-item.subject-math { border-left-color: #6b5b4e; }
    .plan-item.subject-english { border-left-color: #c47d3f; }
    .plan-item.subject-politics { border-left-color: #c0504d; }
    .plan-item.subject-major { border-left-color: #5a8a6a; }
    .plan-item.done { opacity: 0.5; }
    .plan-item.done .plan-item-name { text-decoration: line-through; }
    .plan-item-status { font-size: 15px; cursor: pointer; flex-shrink: 0; }
    .plan-item-body { flex: 1; min-width: 0; cursor: pointer; }
    .plan-item-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .plan-item-time { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .plan-action-btn {
      background: none; border: none; cursor: pointer;
      font-size: 13px; padding: 2px 4px; border-radius: 4px;
      transition: background 0.15s; opacity: 0.3;
    }
    .plan-action-btn:hover { opacity: 1; background: rgba(44,36,23,0.06); }

    /* Plan edit form */
    .plan-edit-form {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 12px; background: var(--accent-light);
      border-radius: var(--radius-sm); margin-bottom: 6px;
      border: 1px solid rgba(107,91,78,0.1);
    }
    .plan-edit-form input {
      border: 1.5px solid rgba(44,36,23,0.1); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; outline: none;
      font-family: inherit; background: var(--surface);
      transition: border-color 0.2s;
    }
    .plan-edit-form input:focus { border-color: var(--accent); }
    .plan-edit-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .plan-edit-btns button {
      border: none; border-radius: 6px; padding: 5px 12px;
      font-size: 11px; cursor: pointer; font-family: inherit;
    }
    .plan-save-btn { background: var(--accent); color: white; }
    .plan-cancel-btn { background: var(--surface-alt); color: var(--text-secondary); }
    .plan-delete-btn { background: #fdf0ef; color: var(--red); }
    .plan-add-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px; border: 1.5px dashed rgba(44,36,23,0.15); border-radius: var(--radius-sm);
      background: transparent; color: var(--text-tertiary); font-size: 12px;
      cursor: pointer; width: 100%; margin-top: 8px; transition: all 0.2s;
      font-family: inherit;
    }
    .plan-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* History section */
    .history-section {
      margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(44,36,23,0.08);
    }
    .history-header {
      font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 10px;
    }
    .history-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px;
    }
    .history-nav button {
      background: var(--surface-alt); border: none; width: 28px; height: 28px;
      border-radius: 50%; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; color: var(--text-secondary);
    }
    .history-nav button:hover { background: var(--accent-light); color: var(--accent); }
    .history-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .history-date { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 90px; text-align: center; }
    .history-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: var(--radius-sm);
      background: var(--bg); margin-bottom: 5px; font-size: 12px;
      border-left: 3px solid transparent;
    }
    .history-item.subject-math { border-left-color: #6b5b4e; }
    .history-item.subject-english { border-left-color: #c47d3f; }
    .history-item.subject-politics { border-left-color: #c0504d; }
    .history-item.subject-major { border-left-color: #5a8a6a; }
    .history-item-status { font-size: 13px; }
    .history-item-name { font-weight: 500; color: var(--text); }
    .history-item-time { color: var(--text-tertiary); font-size: 11px; }
    .history-empty { text-align: center; color: var(--text-tertiary); font-size: 12px; padding: 14px; }

    /* Stats */
    .stat-card {
      background: var(--bg); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px;
      border: 1px solid rgba(44,36,23,0.04);
      transition: box-shadow 0.2s;
    }
    .stat-card:hover { box-shadow: var(--shadow-sm); }
    .stat-card-title {
      font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;
      display: flex; align-items: center; gap: 5px; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .stat-row { display: flex; justify-content: space-around; text-align: center; }
    .stat-item { flex: 1; }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
    .progress-bar-bg {
      height: 7px; background: var(--surface-alt); border-radius: 4px;
      overflow: hidden; margin-top: 8px;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent-gradient);
      border-radius: 4px; transition: width 0.6s ease;
    }
    .chart-container { height: 160px; margin-top: 8px; position: relative; }
    .streak-badge {
      display: inline-block;
      background: var(--warm-light);
      color: var(--warm); padding: 4px 12px; border-radius: 16px;
      font-size: 12px; font-weight: 700;
      border: 1px solid rgba(196,125,63,0.15);
    }

    /* Data Management */
    .data-panel { padding: 4px 0; }

    /* Conversation Bar */
    .conv-bar {

      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);

      width: 30px; height: 30px; border-radius: 8px; border: none;

    .conv-rename-input {
      flex: 1; padding: 6px 10px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--accent); font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text); outline: none;
    }
    .load-earlier-btn {
      display: block; margin: 8px auto; padding: 6px 16px; border-radius: 14px;
      border: 1px solid rgba(44,36,23,0.12); background: var(--surface);
      color: var(--text-secondary); font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .load-earlier-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Sidebar overlay for mobile */
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface); z-index: 100; flex-direction: column;
    }

    }
    .sidebar-overlay-close {

    /* Custom scrollbar */
    .messages::-webkit-scrollbar { width: 4px; }

    /* Pomodoro Timer */
    .pomodoro-card {
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      margin-bottom: 12px; box-shadow: var(--shadow-sm); text-align: center;

    }
    .pomodoro-ring {

    .pomodoro-ring-bg { fill: none; stroke: var(--surface-alt); stroke-width: 6; }
    .pomodoro-ring-fill {

    .pomodoro-time {

<body>
  <div class="container">
    <div class="header">

          <span class="quick-chip" id="pomodoroChip" onclick="togglePomodoroFromChip()">🍅 开始专注</span>

  <!-- 公式编辑器弹窗 -->
  <div class="formula-modal-overlay" id="formulaModal" onclick="if(event.target===this)closeFormulaModal()">
    <div class="formula-modal">
      <div class="formula-modal-header">

          <label>输入公式（LaTeX 语法）</label>
          <textarea id="formulaInput" placeholder="例如：\frac{1}{2} 或 \int_0^1 x^2 dx" oninput="updateFormulaPreview()"></textarea>
          <div class="formula-modal-hint">
            常用语法：\frac{a}{b} 分数 · \sqrt{x} 根号 · x^{n} 上标 · \int 积分 · \sum 求和 · \lim 极限

        <button class="formula-cancel-btn" onclick="closeFormulaModal()">取消</button>

  <script>
    // ==================== 设备身份管理 ====================
    const DEVICE_ID_KEY = 'kaoyan-butler-device-id';
    function getOrCreateDeviceId() {
      let id = localStorage.getItem(DEVICE_ID_KEY);
      if (!id) { id = 'device-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2,9); localStorage.setItem(DEVICE_ID_KEY, id); }
      return id;
    }

    // ==================== 对话历史管理（多会话） ====================
    const OLD_CHAT_HISTORY_KEY = 'kaoyan-butler-chat-history';
    const CONVERSATIONS_KEY = 'kaoyan-butler-conversations';
    const ACTIVE_CONV_KEY = 'kaoyan-butler-active-conv';
    const CONV_HISTORY_PREFIX = 'kaoyan-butler-chat-';
    const MAX_CONV_MESSAGES = 500;
    const RENDER_BATCH_SIZE = 50;

    function getConversations() {
      try { return JSON.parse(localStorage.getItem(CONVERSATIONS_KEY) || '[]'); } catch { return []; }
    }
    function saveConversations(convs) {
      try { localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(convs)); } catch(e) { console.error('保存对话列表失败:', e); }
    }
    function getActiveConvId() {
      return localStorage.getItem(ACTIVE_CONV_KEY) || '';
    }
    function saveActiveConvId(id) {
      localStorage.setItem(ACTIVE_CONV_KEY, id);
    }
    function getConvHistory(convId) {
      try { return JSON.parse(localStorage.getItem(CONV_HISTORY_PREFIX + convId) || '[]'); } catch { return []; }
    }
    function saveConvHistory(convId, msgs) {
      if (msgs.length > MAX_CONV_MESSAGES) msgs.splice(0, msgs.length - MAX_CONV_MESSAGES);
      try { localStorage.setItem(CONV_HISTORY_PREFIX + convId, JSON.stringify(msgs)); } catch(e) { console.error('保存对话历史失败:', e); }
    }
    function generateConvId() {
      return 'conv-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 5);
    }
    function migrateOldChatHistory() {
      const old = localStorage.getItem(OLD_CHAT_HISTORY_KEY);
      if (!old) return;
      try {
        const msgs = JSON.parse(old);
        if (!Array.isArray(msgs) || msgs.length === 0) { localStorage.removeItem(OLD_CHAT_HISTORY_KEY); return; }
        const convId = generateConvId();
        const convs = [{ id: convId, name: '历史对话', createdAt: Date.now(), updatedAt: Date.now() }];
        saveConversations(convs);
        saveConvHistory(convId, msgs);
        saveActiveConvId(convId);
        localStorage.removeItem(OLD_CHAT_HISTORY_KEY);
        console.log('[Migration] 已迁移旧对话历史到多会话格式');
      } catch(e) { console.error('[Migration] 迁移失败:', e); }
    }

    // 兼容旧接口
    function loadChatHistory() { return getConvHistory(getActiveConvId()); }
    function saveChatHistory(msgs) {
      const convId = getActiveConvId();
      saveConvHistory(convId, msgs);
      const convs = getConversations();
      const conv = convs.find(c => c.id === convId);
      if (conv) { conv.updatedAt = Date.now(); saveConversations(convs); }
    }

    // ==================== 考研档案管理 ====================
    const PROFILE_KEY = 'kaoyan-profile';
    const STUDY_RECORDS_KEY = 'kaoyan-study-records';
    const PLANS_KEY = 'kaoyan-plans';
    const MISTAKES_KEY = 'kaoyan-mistakes';

    function getProfile() {
      try { const d = localStorage.getItem(PROFILE_KEY); return d ? JSON.parse(d) : null; } catch { return null; }
    }
    function saveProfile(p) {
      const existing = getProfile();
      const merged = { subjects: [], createdAt: Date.now(), ...existing, ...p, updatedAt: Date.now() };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(merged));
      return merged;
    }
    function getStudyRecords() {
      try { return JSON.parse(localStorage.getItem(STUDY_RECORDS_KEY) || '[]'); } catch { return []; }
    }
    function addStudyRecord(r) {
      const records = getStudyRecords();
      records.push({ ...r, createdAt: Date.now() });
      localStorage.setItem(STUDY_RECORDS_KEY, JSON.stringify(records));
      return records;
    }
    function getStudyStats() {
      const records = getStudyRecords();
      const today = new Date().toISOString().split('T')[0];
      const now = new Date();
      const dayOfWeek = now.getDay() || 7;
      const weekStart = new Date(now); weekStart.setDate(now.getDate() - dayOfWeek + 1);
      const weekStartStr = weekStart.toISOString().split('T')[0];
      const monthStartStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      let todayMin=0, weekMin=0, monthMin=0, totalDays=0;
      const subjects = {}, dates = new Set();
      for (const r of records) {
        dates.add(r.date);
        if (r.date === today) todayMin += r.duration;
        if (r.date >= weekStartStr) weekMin += r.duration;
        if (r.date >= monthStartStr) monthMin += r.duration;
        subjects[r.subject] = (subjects[r.subject]||0) + r.duration;
      }
      totalDays = dates.size;
      let streak = 0;
      let check = new Date(today);
      if (!dates.has(today)) check.setDate(check.getDate()-1);
      for (let i=0;i<365;i++) {
        const d = check.toISOString().split('T')[0];
        if (dates.has(d)) { streak++; check.setDate(check.getDate()-1); } else break;
      }
      return { todayMin, weekMin, monthMin, totalDays, streak, subjects };
    }

    // ==================== 计划管理 ====================
    function getPlans() {
      try { return JSON.parse(localStorage.getItem(PLANS_KEY) || '[]'); } catch { return []; }
    }
    function savePlan(plan) {
      const plans = getPlans();
      const idx = plans.findIndex(p => p.date === plan.date);
      if (idx >= 0) plans[idx] = plan; else plans.push(plan);
      localStorage.setItem(PLANS_KEY, JSON.stringify(plans));
    }
    function getTodayPlan() {
      const today = new Date().toISOString().split('T')[0];
      return getPlans().find(p => p.date === today) || null;
    }

    // ==================== 今日计划面板 ====================
    let editingPlanIdx = -1;

    function renderPlanPanel() {
      const content = document.getElementById('planContent');
      if (!content) return;
      const todayPlan = getTodayPlan();

      if (!todayPlan || !todayPlan.items?.length) {
        content.innerHTML = '<div style="text-align:center;color:var(--text-tertiary);padding:24px 16px;font-size:13px;line-height:1.8;"><div style="font-size:32px;margin-bottom:8px;opacity:0.4;">📋</div>暂无计划<br><small style="opacity:0.6;">点击下方按钮或输入"帮我安排今天的复习"</small></div>';
        return;
      }

      let html = `<div class="plan-header">${todayPlan.date} · ${todayPlan.items.filter(i=>i.status==='done').length}/${todayPlan.items.length} 已完成</div>`;
      todayPlan.items.forEach((item, idx) => {
        if (editingPlanIdx === idx) {
          html += `<div class="plan-edit-form">
            <input type="text" id="editTime-${idx}" value="${item.time}" placeholder="时间段 如 09:00-10:30">
            <input type="text" id="editSubject-${idx}" value="${item.subject}" placeholder="科目">
            <input type="text" id="editTask-${idx}" value="${item.task}" placeholder="任务内容">
            <div class="plan-edit-btns">
              <button class="plan-delete-btn" onclick="deletePlanItem(${idx})">删除</button>
              <button class="plan-cancel-btn" onclick="cancelPlanEdit()">取消</button>
              <button class="plan-save-btn" onclick="savePlanItemEdit(${idx})">保存</button>
            </div>
          </div>`;
        } else {
          const icon = item.status==='done'?'✅':item.status==='skipped'?'⏭️':'⬜';
          const subjClass = item.subject.includes('数')?'subject-math':item.subject.includes('英语')?'subject-english':item.subject.includes('政治')?'subject-politics':'subject-major';
          html += `<div class="plan-item ${item.status==='done'?'done':''} ${subjClass}">
            <span class="plan-item-status" onclick="togglePlanItemByIdx(${idx})">${icon}</span>
            <div class="plan-item-body" onclick="togglePlanItemByIdx(${idx})">
              <div class="plan-item-name">${item.subject} - ${item.task}</div>
              <div class="plan-item-time">${item.time}</div>
            </div>
            <button class="plan-action-btn" onclick="event.stopPropagation();editPlanItem(${idx})" title="编辑">✏️</button>
          </div>`;
        }
      });
      html += '<button class="plan-add-btn" onclick="addPlanItem()">＋ 添加计划项</button>';
      content.innerHTML = html;
    }

    function togglePlanItemByIdx(idx) {
      const p = getTodayPlan(); if (!p||!p.items[idx]) return;
      const s = p.items[idx].status;
      p.items[idx].status = s==='pending'?'done':s==='done'?'skipped':'pending';
      savePlan(p); renderPlanPanel(); renderHistoryPlan();
    }
    function editPlanItem(idx) { editingPlanIdx = idx; renderPlanPanel(); const el = document.getElementById(`editTime-${idx}`); if(el) el.focus(); }
    function cancelPlanEdit() { editingPlanIdx = -1; renderPlanPanel(); }
    function savePlanItemEdit(idx) {
      const p = getTodayPlan(); if (!p||!p.items[idx]) return;
      const time = document.getElementById(`editTime-${idx}`).value.trim();
      const subject = document.getElementById(`editSubject-${idx}`).value.trim();
      const task = document.getElementById(`editTask-${idx}`).value.trim();
      if (!subject||!task) { alert('科目和任务不能为空'); return; }
      p.items[idx] = { ...p.items[idx], time, subject, task };
      savePlan(p); editingPlanIdx = -1; renderPlanPanel();
    }
    function deletePlanItem(idx) {
      const p = getTodayPlan(); if (!p) return;
      p.items.splice(idx, 1);
      if (p.items.length === 0) {
        const plans = getPlans().filter(pl => pl.date !== p.date);
        localStorage.setItem(PLANS_KEY, JSON.stringify(plans));
      } else { savePlan(p); }
      editingPlanIdx = -1; renderPlanPanel();
    }
    function addPlanItem() {
      const p = getTodayPlan();
      const today = new Date().toISOString().split('T')[0];
      if (!p) {
        savePlan({ date: today, items: [{ time:'', subject:'', task:'', status:'pending' }] });
        editingPlanIdx = 0;
      } else {
        p.items.push({ time:'', subject:'', task:'', status:'pending' });
        savePlan(p); editingPlanIdx = p.items.length - 1;
      }
      renderPlanPanel();
      const el = document.getElementById(`editTime-${editingPlanIdx}`); if(el) el.focus();
    }

    // ==================== 历史计划 ====================
    let historyDateIdx = -1; // index into sorted history dates (excluding today)
    let historyDates = [];   // sorted descending

    function buildHistoryDates() {
      const today = new Date().toISOString().split('T')[0];
      const plans = getPlans();
      historyDates = plans.map(p=>p.date).filter(d=>d<today).sort().reverse();
    }

    function renderHistoryPlan() {
      const content = document.getElementById('historyContent');
      const dateEl = document.getElementById('historyDate');
      const prevBtn = document.getElementById('historyPrevBtn');
      const nextBtn = document.getElementById('historyNextBtn');
      if (!content) return;

      buildHistoryDates();

      if (historyDates.length === 0) {
        dateEl.textContent = '暂无';
        prevBtn.disabled = true; nextBtn.disabled = true;
        content.innerHTML = '<div class="history-empty">还没有历史计划</div>';
        return;
      }

      if (historyDateIdx < 0) historyDateIdx = 0;
      if (historyDateIdx >= historyDates.length) historyDateIdx = historyDates.length - 1;

      const date = historyDates[historyDateIdx];
      dateEl.textContent = date;
      prevBtn.disabled = historyDateIdx >= historyDates.length - 1;
      nextBtn.disabled = historyDateIdx <= 0;

      const plan = getPlans().find(p=>p.date===date);
      if (!plan || !plan.items?.length) {
        content.innerHTML = '<div class="history-empty">该日无计划</div>';
        return;
      }

      let html = '';
      plan.items.forEach(item => {
        const icon = item.status==='done'?'✅':item.status==='skipped'?'⏭️':'⬜';
        const hSubjClass = item.subject.includes('数')?'subject-math':item.subject.includes('英语')?'subject-english':item.subject.includes('政治')?'subject-politics':'subject-major';
        html += `<div class="history-item ${hSubjClass}">
          <span class="history-item-status">${icon}</span>
          <div style="flex:1;">
            <span class="history-item-name">${item.subject}</span>
            <span style="color:#999;font-size:11px;"> - ${item.task}</span>
          </div>
          <span class="history-item-time">${item.time}</span>
        </div>`;
      });
      const done = plan.items.filter(i=>i.status==='done').length;
      html += `<div style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:6px;">完成 ${done}/${plan.items.length}</div>`;
      content.innerHTML = html;
    }

    function historyPrev() { if (historyDateIdx < historyDates.length-1) { historyDateIdx++; renderHistoryPlan(); } }
    function historyNext() { if (historyDateIdx > 0) { historyDateIdx--; renderHistoryPlan(); } }

    // ==================== 学习统计面板 ====================
    let statsPieChart = null, statsLineChart = null;

    function formatDuration(min) {
      if (min<60) return `${min}分钟`;
      const h=Math.floor(min/60), m=min%60;
      return m>0?`${h}小时${m}分钟`:`${h}小时`;
    }
    function getPlanCompletionRate() {
      const plans = getPlans();
      let total=0, done=0;
      plans.forEach(p=>{ if(p.items){total+=p.items.length; done+=p.items.filter(i=>i.status==='done').length;} });
      const tp = getTodayPlan();
      return { todayDone:tp?.items?.filter(i=>i.status==='done').length||0, todayTotal:tp?.items?.length||0, totalDone:done, totalItems:total, rate:total>0?Math.round(done/total*100):0 };
    }

    function renderStatsPanel(targetId) {
      const content = document.getElementById(targetId || 'statsContent');
      if (!content) return;
      const profile = getProfile();
      const stats = getStudyStats();
      const pr = getPlanCompletionRate();
      const hasData = stats.totalDays > 0;

      let html = '<div class="stat-card"><div class="stat-card-title">📅 备考进度</div>';
      if (profile?.examDate) {
        const days = Math.ceil((new Date(profile.examDate)-Date.now())/86400000);
        const total = Math.ceil((new Date(profile.examDate)-new Date(profile.createdAt||Date.now()))/86400000);
        const prog = total>0?Math.min(100,Math.max(0,Math.round((total-days)/total*100))):0;
        html += `<div style="font-size:13px;margin-bottom:4px;">距考研 <strong style="color:var(--accent);font-size:18px;">${days}</strong> 天</div>`;
        html += `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${prog}%"></div></div>`;
        html += `<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px;">进度 ${prog}%</div>`;
      } else {
        html += '<div style="font-size:12px;color:var(--text-tertiary);">未设置考试日期</div>';
      }
      if (stats.streak>=1) html += `<div style="margin-top:6px;"><span class="streak-badge">🔥 连续 ${stats.streak} 天</span></div>`;
      html += '</div>';

      html += '<div class="stat-card"><div class="stat-card-title">⏱️ 学习时长</div><div class="stat-row">';
      html += `<div class="stat-item"><div class="stat-value">${Math.round(stats.todayMin/60*10)/10}</div><div class="stat-label">今日(h)</div></div>`;
      html += `<div class="stat-item"><div class="stat-value">${Math.round(stats.weekMin/60*10)/10}</div><div class="stat-label">本周(h)</div></div>`;
      html += `<div class="stat-item"><div class="stat-value">${Math.round((stats.monthMin||0)/60*10)/10}</div><div class="stat-label">本月(h)</div></div>`;
      html += '</div>';
      html += `<div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text-tertiary);">累计 ${stats.totalDays} 天</div></div>`;

      html += '<div class="stat-card"><div class="stat-card-title">📈 近7天趋势</div>';
      if (hasData) html += `<div class="chart-container"><canvas id="${targetId?'overlayTrend':'trendChart'}"></canvas></div>`;
      else html += '<div style="text-align:center;color:var(--text-tertiary);padding:16px;font-size:12px;">暂无数据</div>';
      html += '</div>';

      html += '<div class="stat-card"><div class="stat-card-title">📚 四科分布</div>';
      if (hasData&&Object.keys(stats.subjects).length>0) html += `<div class="chart-container"><canvas id="${targetId?'overlaySubject':'subjectChart'}"></canvas></div>`;
      else html += '<div style="text-align:center;color:var(--text-tertiary);padding:16px;font-size:12px;">暂无数据</div>';
      html += '</div>';

      html += '<div class="stat-card"><div class="stat-card-title">✅ 计划完成率</div><div class="stat-row">';
      html += `<div class="stat-item"><div class="stat-value">${pr.todayDone}/${pr.todayTotal}</div><div class="stat-label">今日</div></div>`;
      html += `<div class="stat-item"><div class="stat-value">${pr.rate}%</div><div class="stat-label">累计</div></div>`;
      html += '</div></div>';

      content.innerHTML = html;
      renderPomodoroCard(targetId);

      if (typeof Chart !== 'undefined' && hasData) {
        renderTrendLineChart(targetId?'overlayTrend':'trendChart');
        if (Object.keys(stats.subjects).length>0) renderSubjectPieChart(targetId?'overlaySubject':'subjectChart');
      }
    }

    function renderTrendLineChart(canvasId) {
      const records = getStudyRecords();
      const labels=[], data=[];
      for (let i=6;i>=0;i--) {
        const d=new Date(); d.setDate(d.getDate()-i);
        labels.push(`${d.getMonth()+1}/${d.getDate()}`);
        data.push(Math.round(records.filter(r=>r.date===d.toISOString().split('T')[0]).reduce((s,r)=>s+r.duration,0)/60*10)/10);
      }
      const ctx = document.getElementById(canvasId); if (!ctx) return;
      if (canvasId==='trendChart'&&statsLineChart) statsLineChart.destroy();
      const chart = new Chart(ctx, { type:'line', data:{ labels, datasets:[{ label:'小时', data, borderColor:'#6b5b4e', backgroundColor:'rgba(107,91,78,0.08)', fill:true, tension:0.4, pointRadius:4, pointBackgroundColor:'#6b5b4e', borderWidth:2 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{font:{size:10},color:'#8a7e6d'},grid:{color:'rgba(44,36,23,0.04)'}},x:{ticks:{font:{size:10},color:'#8a7e6d'},grid:{display:false}}} } });
      if (canvasId==='trendChart') statsLineChart = chart;
    }

    function renderSubjectPieChart(canvasId) {
      const stats = getStudyStats();
      const labels=Object.keys(stats.subjects), data=labels.map(k=>Math.round(stats.subjects[k]/60*10)/10);
      const colors=['#6b5b4e','#c47d3f','#5a8a6a','#9b6b8a','#8b7355','#c0504d'];
      const ctx = document.getElementById(canvasId); if (!ctx) return;
      if (canvasId==='subjectChart'&&statsPieChart) statsPieChart.destroy();
      const chart = new Chart(ctx, { type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:colors.slice(0,labels.length), borderWidth:2, borderColor:'#fff' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:10}}} } });
      if (canvasId==='subjectChart') statsPieChart = chart;
    }

    // ==================== 番茄钟专注计时 ====================
    const POMODORO_KEY = 'kaoyan-pomodoro-state';
    const FOCUS_MIN = 25, BREAK_MIN = 5;
    const CIRCUMFERENCE = 2 * Math.PI * 70; // r=70 for the SVG ring

    let pomodoro = loadPomodoroState();

    function loadPomodoroState() {
      try {
        const s = JSON.parse(localStorage.getItem(POMODORO_KEY) || 'null');
        const defaults = { phase: 'idle', secondsLeft: 0, subject: '数学', totalToday: 0, minutesToday: 0, endTime: null };
        if (!s) return defaults;
        if (s.phase !== 'idle' && s.endTime) {
          const remaining = Math.max(0, Math.ceil((s.endTime - Date.now()) / 1000));
          if (remaining <= 0) {
            if (s.phase === 'focus') { s.phase = 'break'; s.secondsLeft = BREAK_MIN * 60; s.endTime = null; }
            else { s.phase = 'idle'; s.secondsLeft = 0; s.endTime = null; }
          } else {
            s.secondsLeft = remaining;
          }
        }
        return { ...defaults, ...s };
      } catch { return { phase: 'idle', secondsLeft: 0, subject: '数学', totalToday: 0, minutesToday: 0, endTime: null }; }
    }

    function savePomodoroState() {
      localStorage.setItem(POMODORO_KEY, JSON.stringify(pomodoro));
    }

    function getTodayFocusStats() {
      const records = getStudyRecords();
      const today = new Date().toISOString().split('T')[0];
      const focusRecords = records.filter(r => r.date === today && r.content === '番茄钟专注');
      return {
        count: focusRecords.length,
        minutes: focusRecords.reduce((s, r) => s + r.duration, 0)
      };
    }

    function formatPomodoroTime(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    let pomodoroInterval = null;

    function renderPomodoroCard(targetId) {
      const container = document.getElementById(targetId || 'statsContent');
      if (!container) return;
      // Refresh today stats from actual records
      const todayStats = getTodayFocusStats();
      pomodoro.totalToday = todayStats.count;
      pomodoro.minutesToday = todayStats.minutes;

      const totalSec = pomodoro.phase === 'break' ? BREAK_MIN * 60 : FOCUS_MIN * 60;
      const progress = pomodoro.phase === 'idle' ? 0 : (totalSec - pomodoro.secondsLeft) / totalSec;
      const offset = CIRCUMFERENCE * (1 - progress);
      const ringClass = pomodoro.phase === 'break' ? 'pomodoro-ring-fill break' : 'pomodoro-ring-fill';
      const phaseLabel = pomodoro.phase === 'focus' ? '🍅 专注中' : pomodoro.phase === 'break' ? '☕ 休息中' : '准备开始';

      const subjects = ['数学', '英语', '政治', '专业课'];
      let subjectBtns = '';
      subjects.forEach(s => {
        const cls = pomodoro.subject === s ? 'pomodoro-subject-btn active' : 'pomodoro-subject-btn';
        subjectBtns += `<button class="${cls}" onclick="selectPomodoroSubject('${s}')">${s}</button>`;
      });

      let controls = '';
      if (pomodoro.phase === 'idle') {
        controls = `<button class="pomodoro-btn pomodoro-btn-primary" onclick="startPomodoro()">开始专注</button>`;
      } else if (pomodoro.phase === 'focus' || pomodoro.phase === 'break') {
        const pauseLabel = pomodoroInterval ? '暂停' : '继续';
        controls = `<button class="pomodoro-btn pomodoro-btn-secondary" onclick="pausePomodoro()" id="pomodoroPauseBtn">${pauseLabel}</button>`;
        controls += `<button class="pomodoro-btn pomodoro-btn-secondary" onclick="resetPomodoro()">重置</button>`;
      }

      const html = `
        <div class="pomodoro-card">
          <div class="pomodoro-phase">${phaseLabel}</div>
          <div class="pomodoro-ring">
            <svg width="160" height="160" viewBox="0 0 160 160">
              <circle class="pomodoro-ring-bg" cx="80" cy="80" r="70"/>
              <circle class="${ringClass}" cx="80" cy="80" r="70"
                stroke-dasharray="${CIRCUMFERENCE}"
                stroke-dashoffset="${pomodoro.phase === 'idle' ? CIRCUMFERENCE : offset}"/>
            </svg>
            <div class="pomodoro-time">${pomodoro.phase === 'idle' ? formatPomodoroTime(FOCUS_MIN * 60) : formatPomodoroTime(pomodoro.secondsLeft)}</div>
          </div>
          <div class="pomodoro-subject-select">${subjectBtns}</div>
          <div class="pomodoro-controls">${controls}</div>
          <div class="pomodoro-today-stats">
            <div class="pomodoro-today-item">
              <div class="pomodoro-today-value">${pomodoro.totalToday}</div>
              <div class="pomodoro-today-label">今日次数</div>
            </div>
            <div class="pomodoro-today-item">
              <div class="pomodoro-today-value">${Math.round(pomodoro.minutesToday / 60 * 10) / 10}</div>
              <div class="pomodoro-today-label">专注(h)</div>
            </div>
          </div>
        </div>`;
      // Insert at the top of stats content
      const existing = container.querySelector('.pomodoro-card');
      if (existing) existing.parentElement.removeChild(existing);
      container.insertAdjacentHTML('afterbegin', html);
    }

    function selectPomodoroSubject(subject) {
      pomodoro.subject = subject;
      savePomodoroState();
      renderPomodoroCard();
      renderStatsPanel(); // re-render to update overlay too
    }

    function startPomodoro() {
      if (pomodoro.phase !== 'idle') return;
      pomodoro.phase = 'focus';
      pomodoro.secondsLeft = FOCUS_MIN * 60;
      pomodoro.endTime = Date.now() + FOCUS_MIN * 60 * 1000;
      savePomodoroState();
      renderPomodoroCard();
      updatePomodoroChip();
      runPomodoroTick();
    }

    function runPomodoroTick() {
      clearInterval(pomodoroInterval);
      // 预计算结束时间戳，不受浏览器节流影响
      if (!pomodoro.endTime) {
        pomodoro.endTime = Date.now() + pomodoro.secondsLeft * 1000;
        savePomodoroState();
      }
      pomodoroInterval = setInterval(() => {
        const remaining = Math.max(0, Math.ceil((pomodoro.endTime - Date.now()) / 1000));
        if (remaining !== pomodoro.secondsLeft) {
          pomodoro.secondsLeft = remaining;
          savePomodoroState();
          renderPomodoroCard();
        }
        if (remaining <= 0) {
          clearInterval(pomodoroInterval);
          pomodoro.endTime = null;
          savePomodoroState();
          if (pomodoro.phase === 'focus') {
            finishFocusPhase();
          } else if (pomodoro.phase === 'break') {
            finishBreakPhase();
          }
        }
      }, 200);
    }

    function pausePomodoro() {
      if (pomodoro.phase === 'idle') return;
      const btn = document.getElementById('pomodoroPauseBtn');
      if (pomodoroInterval) {
        // Currently running → pause: save remaining time, clear endTime
        clearInterval(pomodoroInterval);
        pomodoroInterval = null;
        pomodoro.secondsLeft = Math.max(0, Math.ceil((pomodoro.endTime - Date.now()) / 1000));
        pomodoro.endTime = null;
        savePomodoroState();
        renderPomodoroCard();
        if (btn) btn.textContent = '继续';
      } else {
        // Currently paused → resume: set new endTime
        pomodoro.endTime = Date.now() + pomodoro.secondsLeft * 1000;
        savePomodoroState();
        runPomodoroTick();
        if (btn) btn.textContent = '暂停';
      }
    }

    function resetPomodoro() {
      clearInterval(pomodoroInterval);
      pomodoroInterval = null;
      pomodoro.phase = 'idle';
      pomodoro.secondsLeft = 0;
      savePomodoroState();
      renderPomodoroCard();
      updatePomodoroChip();
    }

    function finishFocusPhase() {
      playPomodoroBeep();
      // Record the focus session
      const today = new Date().toISOString().split('T')[0];
      addStudyRecord({ date: today, subject: pomodoro.subject, duration: FOCUS_MIN, content: '番茄钟专注', completed: true });
      pomodoro.totalToday++;
      pomodoro.minutesToday += FOCUS_MIN;

      // Auto-start break
      pomodoro.phase = 'break';
      pomodoro.secondsLeft = BREAK_MIN * 60;
      pomodoro.endTime = Date.now() + BREAK_MIN * 60 * 1000;
      savePomodoroState();
      renderPomodoroCard();
      renderStatsPanel();
      updatePomodoroChip();
      runPomodoroTick();

      // Send focus completion message via WebSocket
      if (ws && ws.readyState === WebSocket.OPEN) {
        const focusMsg = `刚完成一个番茄钟，专注了${FOCUS_MIN}分钟${pomodoro.subject}`;
        addMessage(focusMsg, 'user', true);
        showTyping();
        const payload = { type: 'chat', text: focusMsg, deviceId, timestamp: Date.now(), memoryContext: getMemoryContext(), plansJson: getPlansJson() };
        ws.send(JSON.stringify(payload));
      }
    }

    function finishBreakPhase() {
      playPomodoroBeep();
      pomodoro.phase = 'idle';
      pomodoro.secondsLeft = 0;
      savePomodoroState();
      renderPomodoroCard();
      updatePomodoroChip();
      addMessage('休息结束，准备开始下一个番茄钟吧！🍅', 'assistant', true);
    }

    function playPomodoroBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.2);
          osc.stop(ctx.currentTime + i * 0.2 + 0.5);
        });
      } catch (e) { /* Audio not available */ }
    }

    function togglePomodoroFromChip() {
      if (pomodoro.phase === 'idle') {
        switchSidebarTab('stats');
        setTimeout(() => startPomodoro(), 100);
      } else {
        resetPomodoro();
      }
    }

    function updatePomodoroChip() {
      const chip = document.getElementById('pomodoroChip');
      if (!chip) return;
      if (pomodoro.phase === 'idle') {
        chip.textContent = '🍅 开始专注';
      } else {
        chip.textContent = '🍅 结束专注';
      }
    }

    // Resume pomodoro on page load if it was running
    if (pomodoro.phase !== 'idle' && pomodoro.secondsLeft > 0) {
      runPomodoroTick();
      updatePomodoroChip();
    }

    // ==================== Sidebar tab switching ====================
    function switchSidebarTab(tab) {
      document.querySelectorAll('.sidebar-tabs .sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
      document.getElementById('sidebarPlan').style.display = tab==='plan'?'':'none';
      document.getElementById('sidebarStats').style.display = tab==='stats'?'':'none';
      document.getElementById('sidebarMistakes').style.display = tab==='mistakes'?'':'none';
      document.getElementById('sidebarWeeklyReport').style.display = tab==='weeklyReport'?'':'none';
      document.getElementById('sidebarData').style.display = tab==='data'?'':'none';
      if (tab==='plan') { renderPlanPanel(); renderHistoryPlan(); }
      if (tab==='stats') renderStatsPanel();

    // ==================== 记忆上下文 ====================
    function getMemoryContext() {
      const profile=getProfile(), stats=getStudyStats(), plan=getTodayPlan();
      let ctx='';
      if (profile) {
        ctx+='【用户档案】\n';
        if(profile.name) ctx+=`姓名: ${profile.name}\n`;
        if(profile.targetSchool) ctx+=`目标院校: ${profile.targetSchool}\n`;
        if(profile.targetMajor) ctx+=`目标专业: ${profile.targetMajor}\n`;
        if(profile.examDate) { const d=Math.ceil((new Date(profile.examDate)-Date.now())/86400000); ctx+=`考试日期: ${profile.examDate} (还有${d}天)\n`; }
        if(profile.stage) ctx+=`备考阶段: ${profile.stage}\n`;
        if(profile.weakPoints?.length) { const wp=Array.isArray(profile.weakPoints)?profile.weakPoints:[profile.weakPoints]; ctx+=`薄弱点: ${wp.join('、')}\n`; }
        ctx+='\n';
      }
      if (stats.totalDays>0) {
        ctx+='【学习统计】\n';
        ctx+=`累计${stats.totalDays}天，连续${stats.streak}天\n`;
        ctx+=`今日${stats.todayMin}分钟，本周${stats.weekMin}分钟\n`;
        const dist=Object.entries(stats.subjects).map(([k,v])=>`${k}${Math.round(v/60)}h`).join('、');
        if(dist) ctx+=`各科: ${dist}\n\n`;
      }
      if (plan?.items?.length) {
        const done=plan.items.filter(i=>i.status==='done'), pending=plan.items.filter(i=>i.status==='pending');
        ctx+='【今日计划】\n';
        if(done.length) ctx+=`已完成: ${done.map(i=>i.subject+'-'+i.task).join('、')}\n`;
        if(pending.length) ctx+=`待完成: ${pending.map(i=>i.time+' '+i.subject+'-'+i.task).join('、')}\n\n`;
      }
      const mistakes=getMistakes();
      if (mistakes.length>0) {
        const grouped=getMistakesBySubject();
        ctx+='【错题本】\n';
        ctx+=`共${mistakes.length}道错题，`;
        ctx+=Object.entries(grouped).map(([k,v])=>`${k}${v.length}道`).join('、')+'\n';
        const recent=mistakes.slice(0,3);
        ctx+=`最近: ${recent.map(m=>m.subject+'-'+(m.question||'').substring(0,20)).join('；')}\n\n`;
      }
      return ctx;
    }
    function getPlansJson() { return JSON.stringify(getPlans()); }

    // ==================== 错题本管理 ====================
    function getMistakes() {
      try { return JSON.parse(localStorage.getItem(MISTAKES_KEY) || '[]'); } catch { return []; }
    }
    function addMistake(r) {
      const mistakes = getMistakes();
      mistakes.unshift({ ...r, createdAt: r.createdAt || Date.now() });
      if (mistakes.length > 200) mistakes.length = 200;
      localStorage.setItem(MISTAKES_KEY, JSON.stringify(mistakes));
      return mistakes;
    }
    function deleteMistake(id) {
      const mistakes = getMistakes().filter(m => m.id !== id);
      localStorage.setItem(MISTAKES_KEY, JSON.stringify(mistakes));
      return mistakes;
    }
    function getMistakesBySubject() {
      const grouped = {};
      for (const m of getMistakes()) {
        const subj = m.subject || '未分类';
        if (!grouped[subj]) grouped[subj] = [];
        grouped[subj].push(m);
      }
      return grouped;
    }

      const content = document.getElementById(targetId || 'mistakesContent');
      if (!content) return;
      const mistakes = getMistakes();
      const grouped = getMistakesBySubject();
      const subjects = Object.keys(grouped);
      const errorTypes = {};
      for (const m of mistakes) { const t = m.errorType || '未分类'; errorTypes[t] = (errorTypes[t]||0) + 1; }

      let html = '';
      // 统计卡片
      html += '<div class="stat-card"><div class="stat-card-title">📕 错题总览</div>';

      html += `<div class="stat-item"><div class="stat-value">${subjects.length}</div><div class="stat-label">涉及科目</div></div></div>`;
      if (subjects.length) {
        for (const subj of subjects) {
          const pct = mistakes.length ? Math.round(grouped[subj].length / mistakes.length * 100) : 0;
          html += `<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>${subj}</span><span>${grouped[subj].length}题 (${pct}%)</span></div>`;
          html += `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>`;
        }
      }
      html += '</div>';

      // 错误类型分布
      if (Object.keys(errorTypes).length) {
        html += '<div class="stat-card"><div class="stat-card-title">🔍 错误类型</div>';
        for (const [type, count] of Object.entries(errorTypes)) {
          const pct = Math.round(count / mistakes.length * 100);
          html += `<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--accent-light,#e8f0fe);color:var(--accent,#4a7dff)">${type}</span>`;
          html += `<span style="flex:1;height:6px;border-radius:3px;background:var(--border,#e0e0e0)"><span style="display:block;height:100%;border-radius:3px;background:var(--accent,#4a7dff);width:${pct}%"></span></span>`;

          html += `<div class="mistake-item" data-id="${m.id}" style="padding:8px 0;border-bottom:1px solid var(--border,#eee)">`;
          html += `<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleMistakeDetail(this.parentElement)">`;
          html += `<div style="font-size:13px;flex:1">${escapeHtml(q)}${errTag}</div>`;
          html += `<div style="display:flex;align-items:center;gap:6px;margin-left:8px">`;
          html += `<span style="font-size:11px;color:var(--text-tertiary,#aaa);white-space:nowrap">${dateStr}</span>`;
          html += `<button onclick="event.stopPropagation();editMistake('${m.id}')" style="border:none;background:none;cursor:pointer;font-size:13px;padding:2px 4px" title="编辑">✏️</button>`;
          html += `<button onclick="event.stopPropagation();confirmDeleteMistake('${m.id}')" style="border:none;background:none;cursor:pointer;font-size:13px;padding:2px 4px" title="删除">🗑️</button>`;
          html += `</div></div>`;
          if (m.analysis) {
            html += `<div class="mistake-detail" style="display:none;margin-top:8px;padding:10px;background:var(--surface,#f8f8f8);border-radius:8px;font-size:13px;line-height:1.7">${renderContent(m.analysis)}</div>`;
          }
          html += '</div>';
        }
        if (grouped[subj].length > 10) {
          html += `<div style="text-align:center;padding:8px;font-size:12px;color:var(--text-tertiary,#aaa)">还有 ${grouped[subj].length - 10} 道错题...</div>`;

        html += '<div class="stat-card"><div style="text-align:center;padding:20px;color:var(--text-tertiary,#aaa)">还没有错题记录<br><span style="font-size:12px">在对话中发送 "记录一道高数错题" 开始记录吧</span></div></div>';
      }

      content.innerHTML = html;
    }

    function saveMistakeEdit(id) {
      const item = document.querySelector(`.mistake-item[data-id="${id}"]`);
      if (!item) return;
      const fields = item.querySelectorAll('.edit-field');
      const updates = {};
      fields.forEach(f => { updates[f.dataset.field] = f.value; });

      const mistakes = getMistakes();
      const idx = mistakes.findIndex(x => x.id === id);
      if (idx === -1) return;
      Object.assign(mistakes[idx], updates);
      localStorage.setItem(MISTAKES_KEY, JSON.stringify(mistakes));
      renderMistakesPanel();
    }

    // ==================== 提取并保存信息 ====================
    function extractAndSave(m) {
      const nameMatch=m.match(/我叫([一-龥]{2,4})|我是([一-龥]{2,4})/);
      if(nameMatch) saveProfile({name:nameMatch[1]||nameMatch[2]});
      const schoolMatch=m.match(/考([一-龥]{2,10}大学|[一-龥]{2,10}学院)|目标[是校]([一-龥]{2,10})|报考([一-龥]{2,10})/);
      if(schoolMatch) saveProfile({targetSchool:schoolMatch[1]||schoolMatch[2]||schoolMatch[3]});
      const cnNum={'一':1,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
      const nPat='(?:一个半|[\\d.]*半|[\\d.一二两三四五六七八九十]+)';
      const uPat='(?:小时|h|分钟|min)';
      const segs=m.split(/[,，;；。！!？?]+/);
      for(const seg of segs) {
        const s=seg.trim(); if(!s) continue;
        const p1s=s.match(/([一-鿿]{2,6})(?=学[习了]?|复习|背|看了|做了|练了)(?:学[习了]?|复习|背|看了|做了|练了).*?((?:一个半|[\d.]*半|[\d.一二两三四五六七八九十]+))(?:小时|h|分钟|min)/);
        const temporal=/^(今[天晚]|昨[天晚]|明天|后天|前天|早上|上午|下午|今天我|昨天我)/;
        const p1=(p1s&&!temporal.test(p1s[1]))?[0,p1s[2],p1s[1]]:null;
        const p2=s.match(/(?:学[习了]?|复习|背|看了|做了|练了).*?((?:一个半|[\d.]*半|[\d.一二两三四五六七八九十]+))(?:小时|h|分钟|min).*?([一-鿿]{2,6})/);
        const p3=s.match(/((?:一个半|[\d.]*半|[\d.一二两三四五六七八九十]+))(?:小时|h|分钟|min).*?([一-鿿]{2,6})/);
        const m2=p1||p2||p3;
        if(m2){const numStr=m2[1],subj=m2[2];const isMin=s.includes('分钟')||s.includes('min');let mins=0;if(numStr==='一个半'){mins=90;}else if(numStr==='半'){mins=30;}else if(typeof numStr==='string'&&numStr.includes('半')){const base=cnNum[numStr.replace('半','')]||parseFloat(numStr);mins=base*60+30;}else{const n=cnNum[numStr]||parseFloat(numStr);mins=isMin?n:n*60;}if(subj&&mins>0){addStudyRecord({date:new Date().toISOString().split('T')[0],subject:subj,duration:mins,content:s,completed:true});console.log('[记忆] 学习记录已保存:',subj,mins+'分钟');}}
      }
      const examMatch=m.match(/(\d{1,2})月(\d{1,2})[号日].*考试|考试.*(\d{4})-(\d{1,2})-(\d{1,2})/);
      if(examMatch) { const y=examMatch[3]?parseInt(examMatch[3]):new Date().getFullYear(); const mo=examMatch[3]?parseInt(examMatch[4]):parseInt(examMatch[1]); const d=examMatch[3]?parseInt(examMatch[5]):parseInt(examMatch[2]); saveProfile({examDate:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}); }
      const stageMatch=m.match(/(基础|强化|冲刺|考前)阶段/);
      if(stageMatch) saveProfile({stage:stageMatch[1]+'阶段'});
      const weakMatch=m.match(/([一-鿿]{2,6})是我的?弱[项点科]|([一-鿿]{2,6})薄弱/);
      if(weakMatch) { const w=weakMatch[1]||weakMatch[2]; const p=getProfile()||{subjects:[]}; const ex=Array.isArray(p.weakPoints)?p.weakPoints:[]; if(!ex.includes(w)) saveProfile({weakPoints:[...ex,w]}); }
    }

      const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];

    let renderedMsgOffset = 0; // How many messages are NOT yet rendered (from the start)

    function restoreChatHistory() {
      // Clear all existing messages (except typing indicator)
      const msgs = messagesContainer.querySelectorAll('.message-wrapper, .date-separator, .load-earlier-btn');
      msgs.forEach(el => el.remove());

      const total = chatHistory.length;
      const startIdx = Math.max(0, total - RENDER_BATCH_SIZE);
      renderedMsgOffset = startIdx;

      // Add "load earlier" button if needed
      if (startIdx > 0) {
        const btn = document.createElement('button');
        btn.className = 'load-earlier-btn';

        btn.onclick = loadEarlierMessages;
        messagesContainer.insertBefore(btn, typingIndicator);
      }

      // Render the last batch
      let lastDate = '';
      for (let i = startIdx; i < total; i++) {
        const msg = chatHistory[i];
        const msgDate = new Date(msg.timestamp).toISOString().split('T')[0];
        if (msgDate !== lastDate) { addDateSeparator(msgDate); lastDate = msgDate; }

    function loadEarlierMessages() {
      const endIdx = renderedMsgOffset;
      const startIdx = Math.max(0, endIdx - RENDER_BATCH_SIZE);
      if (startIdx >= endIdx) return;

      // Remove old "load earlier" button
      const oldBtn = messagesContainer.querySelector('.load-earlier-btn');
      if (oldBtn) oldBtn.remove();

      // Find first date separator to merge dates correctly
      const firstSep = messagesContainer.querySelector('.date-separator');
      const firstMsgDate = chatHistory[startIdx] ? new Date(chatHistory[startIdx].timestamp).toISOString().split('T')[0] : '';

      // Build fragment
      const fragment = document.createDocumentFragment();
      let lastDate = '';
      for (let i = startIdx; i < endIdx; i++) {
        const msg = chatHistory[i];
        const msgDate = new Date(msg.timestamp).toISOString().split('T')[0];
        if (msgDate !== lastDate) {
          // Only add separator if it doesn't match the current first visible date
          if (!firstSep || firstSep.querySelector('span')?.textContent !== formatSeparatorLabel(msgDate)) {
            const sep = document.createElement('div');
            sep.className = 'date-separator';
            sep.innerHTML = `<span>${formatSeparatorLabel(msgDate)}</span>`;
            fragment.appendChild(sep);
          }
          lastDate = msgDate;
        }
        const wrapper = createMessageElement(msg.text, msg.type);
        fragment.appendChild(wrapper);
      }

      renderedMsgOffset = startIdx;

      // Add new "load earlier" button if needed
      if (startIdx > 0) {
        const btn = document.createElement('button');
        btn.className = 'load-earlier-btn';
        btn.textContent = `📜 加载更早的消息（还有 ${startIdx} 条）`;
        btn.onclick = loadEarlierMessages;
        fragment.appendChild(btn);
      }

      // Insert at the top of messages (after any existing content at top)
      const firstChild = messagesContainer.querySelector('.message-wrapper, .date-separator, .load-earlier-btn');
      if (firstChild) {
        messagesContainer.insertBefore(fragment, firstChild);
      } else {
        messagesContainer.insertBefore(fragment, typingIndicator);
      }
    }

    // ==================== 内容渲染（Markdown + LaTeX） ====================
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderContent(text) {
      if (!text) return '';
      // 检查 KaTeX 是否加载成功
      const hasKatex = typeof katex !== 'undefined';
      const hasMarked = typeof marked !== 'undefined';

      // 先转义 HTML 防止 XSS
      let html = escapeHtml(text);

      // 提取 LaTeX 公式占位符，避免被 marked 处理
      const formulas = [];
      // 块级公式 $$...$$
      html = html.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const idx = formulas.length;
        formulas.push({ tex: tex.trim(), display: true });
        return `%%FORMULA_${idx}%%`;
      });
      // 行内公式 $...$（不匹配转义的 \$ 和空的 $$）
      html = html.replace(/(?<!\$)\$(?!\$)((?:[^$\\]|\\.)+?)\$(?!\$)/g, (_, tex) => {
        const idx = formulas.length;
        formulas.push({ tex: tex.trim(), display: false });
        return `%%FORMULA_${idx}%%`;
      });
      // \[...\] 块级
      html = html.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => {
        const idx = formulas.length;
        formulas.push({ tex: tex.trim(), display: true });
        return `%%FORMULA_${idx}%%`;
      });
      // \(...\) 行内
      html = html.replace(/\\\((.+?)\\\)/g, (_, tex) => {
        const idx = formulas.length;
        formulas.push({ tex: tex.trim(), display: false });
        return `%%FORMULA_${idx}%%`;
      });

      // 用 marked 解析 Markdown
      if (hasMarked) {
        try { html = marked.parse(html, { breaks: true }); } catch(e) { /* fallback to plain */ }
      } else {
        // 简易 markdown：换行、粗体、行内代码
        html = html.replace(/\n/g, '<br>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      // 还原公式为 KaTeX 渲染
      if (hasKatex) {
        for (let i = 0; i < formulas.length; i++) {
          try {
            const rendered = katex.renderToString(formulas[i].tex, {
              displayMode: formulas[i].display,
              throwOnError: false,
              trust: true
            });
            html = html.replace(`%%FORMULA_${i}%%`, rendered);
          } catch(e) {
            html = html.replace(`%%FORMULA_${i}%%`, `<code>${escapeHtml(formulas[i].tex)}</code>`);
          }
        }
      } else {
        // KaTeX 未加载，显示原始 LaTeX
        for (let i = 0; i < formulas.length; i++) {
          const prefix = formulas[i].display ? '$$' : '$';
          html = html.replace(`%%FORMULA_${i}%%`, `<code>${prefix}${escapeHtml(formulas[i].tex)}${prefix}</code>`);
        }
      }

      return html;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      const imgBase64 = pendingImageBase64;
      if (!text && !imgBase64) return;
      if (!ws||ws.readyState!==WebSocket.OPEN) {
        addMessage('连接已断开，正在重连...', 'assistant', false);
        connect(); return;
      }
      const displayText = imgBase64 ? (text || '[图片] 请识别公式') : text;
      addMessage(displayText, 'user', true); showTyping();
      if (text) autoNameConversation(text);

    function wasShownToday(key) { return localStorage.getItem(`kaoyan-reminder-${key}-${new Date().toISOString().split('T')[0]}`)==='1'; }
    function markShownToday(key) { localStorage.setItem(`kaoyan-reminder-${key}-${new Date().toISOString().split('T')[0]}`, '1'); }
    function checkReminders() {
      const profile=getProfile(), stats=getStudyStats(), plan=getTodayPlan();
      const all=[];
      if(!profile&&stats.totalDays===0&&!localStorage.getItem('kaoyan-guide-shown')) {
        localStorage.setItem('kaoyan-guide-shown','1');
        all.push('💡 小贴士：告诉我你的名字、目标院校、考试日期，我会记住的！\n试试右侧的快捷操作开始吧。');
      }
      if(profile?.examDate&&!wasShownToday('exam')) { const d=Math.ceil((new Date(profile.examDate)-Date.now())/86400000); if(d>0&&d<=365){markShownToday('exam');all.push(`距离考研还有 ${d} 天，${d<=30?'最后冲刺！':d<=90?'进入冲刺阶段了！':'坚持就是胜利！'}`);} }
      if(stats.todayMin===0&&stats.totalDays>0&&!wasShownToday('no-study')) { markShownToday('no-study'); all.push('今天还没开始学习哦，先从擅长的科目开始吧！'); }
      if(stats.streak>=3&&!wasShownToday('streak')) { markShownToday('streak'); all.push(`你已经连续学习 ${stats.streak} 天了，太棒了！`); }
      if(plan?.items?.length) { const p=plan.items.filter(i=>i.status==='pending'); if(p.length>0&&!wasShownToday('plan')){markShownToday('plan');all.push(`今天还有 ${p.length} 项计划待完成，加油！`);} }
      if(stats.subjects&&Object.keys(stats.subjects).length>0&&!wasShownToday('stale')) {
        const records=getStudyRecords(), last={};
        records.forEach(r=>{ if(!last[r.subject]||r.date>last[r.subject]) last[r.subject]=r.date; });
        const stale=Object.entries(last).filter(([_,d])=>Math.floor((Date.now()-new Date(d).getTime())/86400000)>=3);
        if(stale.length>0){markShownToday('stale');all.push(`${stale.map(([s])=>s).join('、')} 已经3天以上没学了！`);}
      }
      if(all.length>0) setTimeout(()=>addMessage('📌 今日提醒：\n\n'+all.join('\n'),'assistant',true), 800);
    }

      const newName = prompt('请输入新名称：', conv.name);

      const convId = getActiveConvId();
      const convs = getConversations();
      if (convs.length <= 1) { alert('至少保留一个对话。'); return; }
      const conv = convs.find(c => c.id === convId);
      if (!conv) return;
      if (!confirm(`确定删除对话「${conv.name}」？\n该对话的所有消息将被删除，此操作不可恢复。`)) return;
      // Remove from conversations list
      const newConvs = convs.filter(c => c.id !== convId);
      saveConversations(newConvs);
      // Remove history
      localStorage.removeItem(CONV_HISTORY_PREFIX + convId);

        try {

        const raw = localStorage.getItem(item.key);
        if (raw !== null) {
          try { data[item.key] = JSON.parse(raw); } catch { data[item.key] = raw; }
          if (Array.isArray(data[item.key])) totalItems += data[item.key].length;
          else totalItems += 1;
        }
      }
      // Export conversations and their histories
      const convs = getConversations();
      data[CONVERSATIONS_KEY] = convs;
      data._conversations = {};
      for (const conv of convs) {
        const history = getConvHistory(conv.id);
        data._conversations[conv.id] = history;
        totalItems += history.length;
      }
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      a.href = url;
      a.download = `kaoyan-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert(`✅ 导出成功！共 ${totalItems} 条数据已保存到文件。`);
    }

    function handleDataImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || typeof data !== 'object') {
            alert('❌ 文件格式错误：无法解析为有效数据');
            return;
          }
          // Validate: must have at least one known key or _meta
          const hasMeta = data._meta && data._meta.appVersion === 'kaoyan-butler';
          const knownKeys = DATA_EXPORT_KEYS.map(i => i.key);
          const hasKnownKey = knownKeys.some(k => data[k] !== undefined);
          const hasConversations = data[CONVERSATIONS_KEY] || data._conversations;
          if (!hasMeta && !hasKnownKey && !hasConversations) {
            alert('❌ 文件格式错误：未识别的备份文件');
            return;
          }
          // Count items
          let importCount = 0;
          for (const item of DATA_EXPORT_KEYS) {
            if (data[item.key] !== undefined) {
              importCount += Array.isArray(data[item.key]) ? data[item.key].length : 1;
            }
          }
          // Count conversation messages
          if (data._conversations) {
            for (const convId of Object.keys(data._conversations)) {
              importCount += Array.isArray(data._conversations[convId]) ? data._conversations[convId].length : 0;
            }
          }
          if (!confirm(`📥 确认导入？\n\n将导入 ${importCount} 条数据，覆盖当前相同类型的数据。\n建议先导出当前数据作为备份。\n\n确定继续？`)) {
            return;
          }
          // Import standard data
          for (const item of DATA_EXPORT_KEYS) {
            if (data[item.key] !== undefined) {
              const val = typeof data[item.key] === 'string' ? data[item.key] : JSON.stringify(data[item.key]);
              localStorage.setItem(item.key, val);
            }
          }
          // Import conversations
          if (data[CONVERSATIONS_KEY]) {
            localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(data[CONVERSATIONS_KEY]));
          }
          if (data._conversations) {
            for (const [convId, history] of Object.entries(data._conversations)) {
              localStorage.setItem(CONV_HISTORY_PREFIX + convId, JSON.stringify(history));
            }
          }
          // Handle old format (single chat history) for backwards compatibility
          if (data[OLD_CHAT_HISTORY_KEY] && !data[CONVERSATIONS_KEY]) {
            // Will be migrated on next page load
            localStorage.setItem(OLD_CHAT_HISTORY_KEY, JSON.stringify(data[OLD_CHAT_HISTORY_KEY]));
          }
          alert(`✅ 导入成功！共导入 ${importCount} 条数据。\n页面将在 2 秒后刷新...`);
          setTimeout(() => location.reload(), 2000);
        } catch (err) {
          alert('❌ 文件解析失败：' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset file input
    }

    function clearAllData() {
      if (!confirm('⚠️ 确认清空所有数据？\n\n此操作将删除所有本地数据且不可恢复。\n建议先导出备份。\n\n确定继续？')) return;
      if (!confirm('🔴 最后确认：真的要删除所有数据吗？')) return;
      for (const item of DATA_EXPORT_KEYS) localStorage.removeItem(item.key);
      // Clear all conversation histories
      const convs = getConversations();
      for (const conv of convs) localStorage.removeItem(CONV_HISTORY_PREFIX + conv.id);
      localStorage.removeItem(CONVERSATIONS_KEY);
      localStorage.removeItem(ACTIVE_CONV_KEY);
      localStorage.removeItem(OLD_CHAT_HISTORY_KEY);
      alert('✅ 所有数据已清空。页面将在 2 秒后刷新...');
      setTimeout(() => location.reload(), 2000);
    }
